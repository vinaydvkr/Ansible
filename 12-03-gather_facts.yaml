- name: Gather facts demo
  hosts: local
  connection: local
  tasks:
    - name: gather facts
      ansible.builtin.debug:
        msg: "{{ ansible_facts }}"

    - name: Details form facts
      ansible.builtin.debug:
        msg: |
          architevture: "{{ ansible_facts['architecture'] }}"
          bios_vendor: "{{ ansible_facts['bios_vendor'] }}"
          bios_version: "{{ ansible_facts['bios_version'] }}"
          board_asset_tag: "{{ ansible_facts['board_asset_tag'] }}"

