- name: variables on prmopt
  hosts: local
  connection: local
  vars_prompt:
  - name: student_name
    prompt: Enter the student name
    private: false

  - name: DOB
    prompt: Enter DOB of student
    private: false

  - name: Base_location
    prompt: Enter base location
    private: false
  
  tasks:
    - name: enter the details
      ansible.builtin.debug:
        msg: "student name is {{ student_name }} DOB is {{ DOB }} and the base location is {{ Base_location }}"