- name: Gathering facts
  hosts: local
  connection: local
  tasks:
  - name: this is for ansible facts
    ansible.builtin.debug:
      msg: "{{ ansible_facts }}"

  - name: gather facts
    ansible.builtin.debug:
      msg: |
        OS_Family: "{{ ansible_facts['os_family'] }}" 
        Python_Version: "{{ ansible_facts['python_version'] }}"    
        system: "{{ ansible_facts['system']}}"   
