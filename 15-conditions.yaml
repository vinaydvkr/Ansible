- name: Print OS is RedHat or Debian
  hosts: local
  connection: local
  become: true
  tasks:
  - name: Install nginx on RedHat
    ansible.builtin.dnf:
      state: present
      name: nginx
    when: ansible_facts.os_family == "RedHat"

  - name: Install nginx on Debian
    ansible.builtin.dnf: 
      state: present
      name: Debian
    when: ansible_facts.os_family == "Debian"