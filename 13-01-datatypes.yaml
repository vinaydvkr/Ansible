- name: demo on data types
  hosts: local
  connection: local
  vars:
    course: "AIOps with DevSecOps on AWS" #string
    duration_of_course: 120 days # number
    live_sessions: true # boolean
    topics: # list
    - Linux
    - Shell
    - Ansible
    - Terroform
    - GitHub
    - Docker
    - Kubernetis
    - AWS Cloud
    tranier_details: #dictionary/map
      trainer_name: Vinay Kumar Reddy DeReddy
      months: 4 months
    exact_duration_months: 4.5 months
  tasks:
  - name: printing the data types
    ansible.builtin.debug:
      msg: |
        Course details are: "{{ course }} : {{ course | type_debug }}"
        Duration of the course is: "{{ duration_of_course }} : {{ duration_of_course  | type_debug }}"
        is the seesion live: "{{ live_sessions }} : {{ live_sessions  | type_debug }}"
        List if the topics are: "{{ topics }} : {{ topics  | type_debug }}"
        Trainer details are: "{{ tranier_details }} : {{ tranier_details  | type_debug }}"
        Exact duration of course in months: "{{ exact_duration_months }} : {{ exact_duration_months | type_debug }}"