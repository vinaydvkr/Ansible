- name: demo on loops
  hosts: local
  connection: local
  become: yes

  vars:
    packages:
      - { name: git, state: present }
      - { name: curl, state: absent }
      - { name: tmux, state: present }
      - { name: net-tools, state: absent }
      - { name: mysql, state: present }

  tasks:
    - name: Install or remove packages
      ansible.builtin.package:
        name: "{{ item.name }}"
        state: "{{ item.state }}"
      loop: "{{ packages }}"